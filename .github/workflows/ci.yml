name: 7Cards CI - multiplayer v1.9
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate multiplayer and game release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install room relay dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check relay-server.js
      - name: Test private/public room privacy, friends and audio relay
        run: npm test
      - name: Test in-game team mic, equal deals for 2-8, public rooms, v1.9
        run: node scripts/check-release.mjs
