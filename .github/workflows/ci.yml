name: 7Cards CI - multiplayer v1.6
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate multiplayer and game release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install room relay dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check relay-server.js
      - name: Test two-player room and bidirectional voice relay
        run: npm test
      - name: Test card rules, audio codec, and version
        run: node scripts/check-release.mjs
