name: 7Cards CI - validate v1.1
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate game release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app syntax
        run: node --check app.js
      - name: Check service worker syntax
        run: node --check sw.js
      - name: Verify game rules and v1.1 assets
        run: node scripts/check-release.mjs
# CD: the existing Render static site is linked to the GitHub 'main' branch,
# with Render Auto Deploy set to 'On Commit'. Pushes to main trigger Render deployment.
# For CI-gated CD, change Render Auto Deploy to 'After CI Checks Pass' in dashboard.
